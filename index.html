<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive Quiz</title>
<style>
  :root {
    --bg: #f1f5f9;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --primary: #4f46e5;
    --primary-dark: #4338ca;
    --border: #e2e8f0;
    --selected-bg: #eef2ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .quiz {
    width: 100%;
    max-width: 560px;
    background: var(--card);
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 10px 30px rgba(15, 23, 42, 0.1);
  }
  .meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .progress {
    height: 6px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .progress-bar {
    height: 100%;
    width: 0;
    background: var(--primary);
    transition: width 0.3s ease;
  }
  h1 { font-size: 22px; line-height: 1.35; margin: 0 0 20px; }
  .options { display: grid; gap: 10px; }
  .option {
    text-align: left;
    padding: 14px 16px;
    font-size: 16px;
    color: var(--text);
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .option:hover { border-color: var(--primary); }
  .option.selected {
    border-color: var(--primary);
    background: var(--selected-bg);
    font-weight: 600;
  }
  .btn {
    margin-top: 22px;
    width: 100%;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    background: var(--primary);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn:hover:not(:disabled) { background: var(--primary-dark); }
  .btn:disabled { background: #cbd5e1; cursor: not-allowed; }
  .result { text-align: center; }
  .score-circle {
    width: 130px;
    height: 130px;
    margin: 8px auto 18px;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--selected-bg);
    border: 6px solid var(--primary);
  }
  .score-value { font-size: 36px; font-weight: 700; color: var(--primary); }
  .score-total { font-size: 14px; color: var(--muted); }
  .result h2 { margin: 0 0 8px; font-size: 24px; }
  .result p { margin: 0; color: var(--muted); line-height: 1.5; }
  .hidden { display: none; }
</style>
</head>
<body>
  <main class="quiz">
    <section id="quiz-screen">
      <div class="meta">
        <span id="question-number">Question 1 of 6</span>
        <span id="running-score">Score: 0</span>
      </div>
      <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
      <h1 id="question-text"></h1>
      <div class="options" id="options"></div>
      <button class="btn" id="next-btn" disabled>Next</button>
    </section>

    <section id="result-screen" class="result hidden">
      <div class="score-circle">
        <span class="score-value" id="final-score">0</span>
        <span class="score-total" id="final-total">out of 6</span>
      </div>
      <h2 id="result-title"></h2>
      <p id="result-message"></p>
      <button class="btn" id="restart-btn">Play Again</button>
    </section>
  </main>

<script>
  const questions = [
    {
      question: "What is the capital city of Nigeria?",
      options: ["Lagos", "Abuja", "Port Harcourt", "Kano"],
      answer: 1
    },
    {
      question: "Which language is used to style web pages?",
      options: ["HTML", "Python", "CSS", "SQL"],
      answer: 2
    },
    {
      question: "How many continents are there on Earth?",
      options: ["Five", "Six", "Seven", "Eight"],
      answer: 2
    },
    {
      question: "Which planet is known as the Red Planet?",
      options: ["Venus", "Jupiter", "Mars", "Mercury"],
      answer: 2
    },
    {
      question: "What does JavaScript mainly add to a website?",
      options: ["Interactivity", "Page colors", "Database storage", "Server hardware"],
      answer: 0
    },
    {
      question: "What is the largest ocean in the world?",
      options: ["Atlantic Ocean", "Indian Ocean", "Arctic Ocean", "Pacific Ocean"],
      answer: 3
    }
  ];

  const quizScreen = document.getElementById("quiz-screen");
  const resultScreen = document.getElementById("result-screen");
  const questionNumber = document.getElementById("question-number");
  const runningScore = document.getElementById("running-score");
  const progressBar = document.getElementById("progress-bar");
  const questionText = document.getElementById("question-text");
  const optionsBox = document.getElementById("options");
  const nextBtn = document.getElementById("next-btn");
  const restartBtn = document.getElementById("restart-btn");
  const finalScore = document.getElementById("final-score");
  const finalTotal = document.getElementById("final-total");
  const resultTitle = document.getElementById("result-title");
  const resultMessage = document.getElementById("result-message");

  let currentIndex = 0;
  let score = 0;
  let selectedIndex = null;

  function showQuestion() {
    const current = questions[currentIndex];
    selectedIndex = null;
    nextBtn.disabled = true;
    nextBtn.textContent = currentIndex === questions.length - 1 ? "Finish" : "Next";

    questionNumber.textContent = "Question " + (currentIndex + 1) + " of " + questions.length;
    runningScore.textContent = "Score: " + score;
    progressBar.style.width = (currentIndex / questions.length) * 100 + "%";
    questionText.textContent = current.question;

    optionsBox.innerHTML = "";
    current.options.forEach(function (text, index) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "option";
      button.textContent = text;
      button.addEventListener("click", function () {
        selectOption(index);
      });
      optionsBox.appendChild(button);
    });
  }

  function selectOption(index) {
    selectedIndex = index;
    const buttons = optionsBox.querySelectorAll(".option");
    buttons.forEach(function (button, i) {
      button.classList.toggle("selected", i === index);
    });
    nextBtn.disabled = false;
  }

  function handleNext() {
    if (selectedIndex === null) return;

    if (selectedIndex === questions[currentIndex].answer) {
      score++;
    }

    currentIndex++;

    if (currentIndex < questions.length) {
      showQuestion();
    } else {
      showResult();
    }
  }

  function getResultContent() {
    const percent = (score / questions.length) * 100;

    if (percent === 100) {
      return { title: "Perfect score!", message: "Outstanding! You answered every question correctly." };
    }
    if (percent >= 80) {
      return { title: "Excellent work!", message: "You really know your stuff. Just a tiny bit away from perfect." };
    }
    if (percent >= 60) {
      return { title: "Good job!", message: "Solid performance. A little more practice and you will ace it." };
    }
    if (percent >= 40) {
      return { title: "Not bad!", message: "You are getting there. Give it another try to improve your score." };
    }
    return { title: "Keep practicing!", message: "Do not give up. Review the topics and try again." };
  }

  function showResult() {
    quizScreen.classList.add("hidden");
    resultScreen.classList.remove("hidden");

    const content = getResultContent();
    finalScore.textContent = score;
    finalTotal.textContent = "out of " + questions.length;
    resultTitle.textContent = content.title;
    resultMessage.textContent = content.message;
  }

  function restart() {
    currentIndex = 0;
    score = 0;
    selectedIndex = null;
    resultScreen.classList.add("hidden");
    quizScreen.classList.remove("hidden");
    showQuestion();
  }

  nextBtn.addEventListener("click", handleNext);
  restartBtn.addEventListener("click", restart);

  showQuestion();
</script>
</body>
</html>
